{{- /* chezmoi:modify-template */ -}}
{{- /* Edits wincmd.ini line by line: sets only the keys below and keeps every other line, in order.
       History and state are redirected to history.ini and state.ini, which stay local. */ -}}
{{- $home := replace "/" "\\" .chezmoi.homeDir -}}
{{- $spec := list
    (dict "name" "Configuration" "own" false "pairs" (list
        (list `1hourdif` `0`)
        (list `Aligned extension` `1`)
        (list `AlwaysToRoot` `0`)
        (list `autotreechange` `0`)
        (list `AutoUpdateCheck` `2`)
        (list `CommentPreferredFormat` `4`)
        (list `CompareBytesPerLine` `8`)
        (list `CompareCaseSensitive` `0`)
        (list `CompareIgnoreRepeatedLines` `0`)
        (list `CompareIgnoreRepSpace` `0`)
        (list `CompareVertical` `0`)
        (list `CopyComments` `6`)
        (list `CopyDirTimeStamp` `1`)
        (list `CountMarked` `1`)
        (list `CountSpace` `1`)
        (list `DarkMode` `1`)
        (list `DirBrackets` `0`)
        (list `DirTabFilters` `1`)
        (list `DirTabLimit` `32`)
        (list `DirTabOptions` `824`)
        (list `DirTabRevert` `1`)
        (list `EverythingForSize` `0`)
        (list `ExecCmdLineFocused` `1`)
        (list `ExplorerForCopy` `0`)
        (list `FileTipWindows` `0`)
        (list `GetDirSize` `0`)
        (list `IconClickSelection` `1`)
        (list `IconOverlays` `0`)
        (list `IconsInMenus` `17`)
        (list `IconsOnNet` `1`)
        (list `IconsSpecialFolders` `3`)
        (list `MarkDirectories` `1`)
        (list `MinIconWidth` `-2`)
        (list `MinLineHeight` `-1`)
        (list `OldStyleTree` `0`)
        (list `onlyonce` `1`)
        (list `PanelsVertical` `0`)
        (list `PluginBaseDir` `%APPDATA%\GHISLER\Plugins`)
        (list `QuickSearchAutoFilter` `1`)
        (list `RenameSelOnlyName` `1`)
        (list `SaveCommands` `1`)
        (list `Savepanels` `1`)
        (list `Savepath` `1`)
        (list `SeparateTree` `0`)
        (list `ShowEXEandLNKicons` `2`)
        (list `ShowHiddenSystem` `1`)
        (list `Showicons` `2`)
        (list `ShowParentDirInRoot` `1`)
        (list `SingleClickStart` `0`)
        (list `Small83Names` `0`)
        (list `SortDirsByName` `1`)
        (list `SortUpper` `0`)
        (list `Tips` `3`)
        (list `TrayIcon` `0`)
        (list `UseEverything` `0`)
        (list `UseLongNames` `1`)
        (list `UseNewDefFont` `1`)
        (list `UseRightButton` `1`)
        (list `UseTrash` `1`)
        (list `WatchDirs` `59`)
        (list `Win32TipWindows` `0`)
        (list `Win95Delete` `0`)))
    (dict "name" "Layout" "own" false "pairs" (list
        (list `BreadCrumbBar` `1`)
        (list `ButtonBar` `1`)
        (list `ButtonBarVertical` `1`)
        (list `CmdLine` `0`)
        (list `CurDir` `1`)
        (list `DirectoryTabs` `1`)
        (list `DriveBar1` `0`)
        (list `DriveBar2` `0`)
        (list `DriveBarFlat` `1`)
        (list `DriveCombo` `1`)
        (list `HistoryHotlistButtons` `1`)
        (list `InterfaceFlat` `1`)
        (list `KeyButtons` `0`)
        (list `StatusBar` `1`)
        (list `TabHeader` `1`)
        (list `XPthemeBg` `1`)))
    (dict "name" "Lister" "own" false "pairs" (list (list "Wrap" "0")))
    (dict "name" "DirMenu" "own" true "pairs" (list
        (list "menu1" "Home Directory") (list "cmd1" (printf "cd %s" $home))
        (list "menu2" "Downloads") (list "cmd2" (printf "cd %s\\Downloads" $home))
        (list "menu3" "OneDrive") (list "cmd3" (printf "cd %s\\OneDrive" $home))
        (list "menu4" "dev") (list "cmd4" `cd C:\dev`)))
-}}
{{- range list "SearchName" "SearchIn" "SearchText" "Selection" "MkDirHistory" "Command line history" "NewFileHistory" "LeftHistory" "RightHistory" -}}
{{-   $spec = append $spec (dict "name" . "own" true "pairs" (list (list "RedirectSection" "history.ini"))) -}}
{{- end -}}
{{- range list "left" "right" "lefttabs" "righttabs" "RenameTemplates" "RenameSearchFind" "RenameSearchReplace" -}}
{{-   $spec = append $spec (dict "name" . "own" true "pairs" (list (list "RedirectSection" "state.ini"))) -}}
{{- end -}}
{{- $byName := dict -}}
{{- range $spec }}{{ $_ := set $byName (lower .name) . }}{{ end -}}

{{- /* Split the file into sections, keeping every line byte for byte. */ -}}
{{- $in := replace "\r" "" .chezmoi.stdin -}}
{{- $lines := list -}}
{{- if $in }}{{ $lines = splitList "\n" (trimSuffix "\n" $in) }}{{ end -}}
{{- $sections := list -}}
{{- $cur := dict "name" "" "lines" (list) -}}
{{- range $lines -}}
{{-   if regexMatch `^\[.+\]$` . -}}
{{-     $sections = append $sections $cur -}}
{{-     $cur = dict "name" (trimSuffix "]" (trimPrefix "[" .)) "lines" (list) -}}
{{-   else -}}
{{-     $_ := set $cur "lines" (append $cur.lines .) -}}
{{-   end -}}
{{- end -}}
{{- $sections = append $sections $cur -}}

{{- $out := list -}}
{{- $done := dict -}}
{{- range $sections -}}
{{-   if ne .name "" }}{{ $out = append $out (printf "[%s]" .name) }}{{ end -}}
{{-   $m := get $byName (lower .name) -}}
{{-   if not $m -}}
{{-     range .lines }}{{ $out = append $out . }}{{ end -}}
{{-   else if $m.own -}}
{{-     range $m.pairs }}{{ $out = append $out (printf "%s=%s" (index . 0) (index . 1)) }}{{ end -}}
{{-   else -}}
{{-     $want := dict -}}
{{-     range $m.pairs }}{{ $_ := set $want (lower (index . 0)) . }}{{ end -}}
{{-     $written := dict -}}
{{-     range .lines -}}
{{-       $k := lower (regexReplaceAll `=.*$` . "") -}}
{{-       if and (contains "=" .) (hasKey $want $k) -}}
{{-         $p := get $want $k -}}
{{-         $out = append $out (printf "%s=%s" (index $p 0) (index $p 1)) -}}
{{-         $_ := set $written $k true -}}
{{-       else -}}
{{-         $out = append $out . -}}
{{-       end -}}
{{-     end -}}
{{-     range $m.pairs -}}
{{-       if not (hasKey $written (lower (index . 0))) }}{{ $out = append $out (printf "%s=%s" (index . 0) (index . 1)) }}{{ end -}}
{{-     end -}}
{{-   end -}}
{{-   $_ := set $done (lower .name) true -}}
{{- end -}}

{{- /* Add managed sections the file doesn't have yet. */ -}}
{{- range $spec -}}
{{-   if not (hasKey $done (lower .name)) -}}
{{-     $out = append $out (printf "[%s]" .name) -}}
{{-     range .pairs }}{{ $out = append $out (printf "%s=%s" (index . 0) (index . 1)) }}{{ end -}}
{{-   end -}}
{{- end -}}

{{- join "\r\n" $out }}{{ "\r\n" -}}
